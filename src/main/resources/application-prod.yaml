# Producción en Azure (PostgreSQL Flexible Server). Sin defaults en secretos ni en infraestructura: si falta algo, no arranca.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # validate: el esquema lo gobiernan las migraciones, no Hibernate.
      ddl-auto: validate
    show-sql: false

logging:
  level:
    org.hibernate.SQL: warn

# Sin documentación interactiva expuesta en producción.
springdoc:
  api-docs:
    enabled: false
  scalar:
    enabled: false

grading:
  engine: http
  auto-on-submit: true
  async:
    pool-size: ${GRADING_POOL_SIZE:1}
  ai:
    base-url: ${AI_SERVICE_URL}
    api-key: ${AI_SERVICE_API_KEY}
    timeout-seconds: 90

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  cors:
    # Terraform inyecta CORS_ALLOWED_ORIGINS (URL por defecto del front + dominio propio); el valor fijo es el respaldo.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://criteria.angelanampa.dev}
