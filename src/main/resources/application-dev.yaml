# Dev en Azure (dev.criteria.angelanampa.dev). Imita a prod pero con datos de prueba.
# Nada se asume: la base y los secretos llegan por variable de entorno (Terraform).
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    org.hibernate.SQL: warn

grading:
  engine: ${GRADING_ENGINE:http}
  auto-on-submit: true
  async:
    pool-size: ${GRADING_POOL_SIZE:1}
  ai:
    base-url: ${AI_SERVICE_URL}
    api-key: ${AI_SERVICE_API_KEY:}
    timeout-seconds: 90

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  cors:
    allowed-origins: https://dev.criteria.angelanampa.dev
