# Backend corriendo en tu máquina (./mvnw spring-boot:run) contra el Postgres de docker compose.
spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:system_academy}
    username: ${POSTGRES_USER:system_academy}
    password: ${POSTGRES_PASSWORD:system_academy}
  flyway:
    # Tu Postgres local ya tenía tablas creadas por Hibernate: se toma V1 como ya aplicada.
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug

grading:
  # mock: motor simulado | http: delega en el microservicio SystemAcademy_AI
  engine: ${GRADING_ENGINE:mock}
  auto-on-submit: ${GRADING_AUTO_ON_SUBMIT:true}
  async:
    pool-size: ${GRADING_POOL_SIZE:1}
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    api-key: ${AI_SERVICE_API_KEY:}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:90}

app:
  jwt:
    # secreto fijo solo para local, nunca usar fuera de tu máquina.
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32chars}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
