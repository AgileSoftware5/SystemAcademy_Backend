# push a develop -> dev, push a main -> prod: corre CI y, si pasa, construye la imagen, la publica en GHCR
# y actualiza el Container App que creó Terraform (system-academy-infra).
name: Deploy

on:
  push:
    branches: [develop, main]

permissions:
  contents: read
  packages: write
  id-token: write # OIDC hacia Azure

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      APP: ca-criteria-${{ github.ref_name == 'main' && 'prod' || 'dev' }}-api
      RESOURCE_GROUP: rg-criteria-${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Nombre de la imagen (GHCR exige minúsculas)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/system-academy-backend" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Actualizar el Container App
        run: |
          az containerapp update \
            --name "$APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE:${{ github.sha }}"
